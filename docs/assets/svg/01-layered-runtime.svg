  <text class="ct" x="347" y="169">认证与工作台</text><text class="ct" x="612" y="169">流式聊天</text><text class="ct" x="877" y="169">知识库</text><text class="ct" x="1142" y="169">AIOps</text><text class="ct" x="1410" y="169">MCP 管理</text>

  <rect x="30" y="225" width="150" height="190" rx="9" fill="#16845b"/><text class="side" x="105" y="296">02</text><text class="side" x="105" y="327">FastAPI</text><text class="side" x="105" y="358">后端</text>
