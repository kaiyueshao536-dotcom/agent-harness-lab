  <rect x="30" y="912" width="150" height="58" rx="9" fill="#243a73"/><text class="side" x="105" y="938">06</text><text class="side" x="105" y="962">仓库 Harness</text>
  <rect class="p" x="200" y="912" width="1370" height="58" stroke="#243a73"/>
