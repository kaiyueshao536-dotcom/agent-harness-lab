<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Agent Py 项目架构第一版</title>
  <desc id="desc">以彩色横向分层展示 Agent Py 的前端、后端、Agent、模型检索、数据外部系统和仓库 Harness。</desc>
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#183153" flood-opacity=".09"/></filter>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1d5fbf"/></marker>
    <style>
      text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#14213d;letter-spacing:0}.p{fill:#fff;stroke-width:2;rx:10;filter:url(#s)}.c{fill:#fff;stroke-width:1.5;rx:7}.st{font-size:21px;font-weight:700;text-anchor:middle}.ct{font-size:16px;font-weight:650;text-anchor:middle}.sub{font-size:12px;fill:#607087;text-anchor:middle}.side{fill:#fff;font-size:20px;font-weight:700;text-anchor:middle}.flow{fill:none;stroke:#1d5fbf;stroke-width:2;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f7f9fc"/>
  <text x="800" y="45" font-size="34" font-weight="760" text-anchor="middle">Agent Py 项目架构</text>
  <text x="800" y="70" font-size="14" fill="#66758a" text-anchor="middle">第一版 · 彩色分层运行时视图</text>

