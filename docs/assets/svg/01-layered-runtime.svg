  <rect class="p" x="200" y="813" width="1370" height="73" stroke="#6044a6"/>
  <g stroke="#6044a6"><rect class="c" x="225" y="832" width="190" height="35"/><rect class="c" x="435" y="832" width="190" height="35"/><rect class="c" x="645" y="832" width="190" height="35"/><rect class="c" x="855" y="832" width="210" height="35"/><rect class="c" x="1085" y="832" width="210" height="35"/><rect class="c" x="1315" y="832" width="230" height="35"/></g>
