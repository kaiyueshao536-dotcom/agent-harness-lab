<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Agent Py AI 驱动工程架构第四版</title>
  <desc id="desc">第一版彩色分层风格，展示 Repository Harness 与 OpenSpec 驱动 AI Coding Agent 构建整个项目。</desc>
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17304f" flood-opacity=".09"/></filter>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1768c5"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16845b"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e85d04"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6044a6"/></marker>
    <style>
      text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#14213d;letter-spacing:0}.panel{fill:#fff;stroke-width:2;rx:10;filter:url(#s)}.card{fill:#fff;stroke-width:1.5;rx:7}.side{fill:#fff;font-size:20px;font-weight:700;text-anchor:middle}.num{fill:#fff;font-size:17px;font-weight:700;text-anchor:middle}.h{font-size:21px;font-weight:700;text-anchor:middle}.ct{font-size:16px;font-weight:650;text-anchor:middle}.sub{font-size:12px;fill:#607087;text-anchor:middle}.bf{fill:none;stroke:#1768c5;stroke-width:2.2;marker-end:url(#b)}.gf{fill:none;stroke:#16845b;stroke-width:2.2;marker-end:url(#g)}.of{fill:none;stroke:#e85d04;stroke-width:2.2;marker-end:url(#o)}.fb{fill:none;stroke:#6044a6;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#p)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f7f9fc"/>
  <text x="800" y="44" font-size="33" font-weight="760" text-anchor="middle">Repository Harness 驱动 AI Coding</text>
  <text x="800" y="70" font-size="14" fill="#66758a" text-anchor="middle">第四版 · OpenSpec 将需求转化为 AI 可执行、可验证的项目变更</text>

  <rect x="30" y="94" width="150" height="105" rx="9" fill="#1768c5"/><text class="num" x="105" y="128">01</text><text class="side" x="105" y="161">需求入口</text>
  <rect class="panel" x="200" y="94" width="1370" height="105" stroke="#1768c5"/>
  <g stroke="#1768c5"><rect class="card" x="230" y="125" width="190" height="50"/><rect class="card" x="450" y="125" width="190" height="50"/><rect class="card" x="670" y="125" width="190" height="50"/><rect class="card" x="890" y="125" width="190" height="50"/><rect x="1150" y="113" width="380" height="72" rx="8" fill="#eef6ff" stroke="#1768c5" stroke-width="2"/></g>
  <text class="ct" x="325" y="156">功能需求</text><text class="ct" x="545" y="156">缺陷修复</text><text class="ct" x="765" y="156">架构演进</text><text class="ct" x="985" y="156">用户反馈</text>
  <text x="1340" y="143" font-size="18" font-weight="700" fill="#1768c5" text-anchor="middle">Change Intent</text><text class="sub" x="1340" y="165">范围 · 目标 · 约束 · 验收标准</text>
  <path class="bf" d="M420 150H440M640 150H660M860 150H880M1080 150H1140"/>

  <rect x="30" y="227" width="150" height="190" rx="9" fill="#16845b"/><text class="num" x="105" y="267">02</text><text class="side" x="105" y="300">Repository</text><text class="side" x="105" y="328">Harness</text><text x="105" y="356" fill="#d9f5e8" font-size="12" text-anchor="middle">工程控制面</text>
  <rect class="panel" x="200" y="227" width="1370" height="190" stroke="#16845b"/>
  <text class="h" x="885" y="260" fill="#16845b">为 AI 提供规则、上下文与可执行规格</text>
  <g stroke="#16845b"><rect class="card" x="225" y="284" width="190" height="92"/><rect class="card" x="435" y="274" width="650" height="112"/><rect class="card" x="1105" y="284" width="200" height="92"/><rect class="card" x="1325" y="284" width="220" height="92"/></g>
  <text class="ct" x="320" y="316">AGENTS.md</text><text class="sub" x="320" y="339">仓库结构 · 编码规则</text><text class="sub" x="320" y="359">权限与集成边界</text>
  <rect x="457" y="294" width="606" height="52" rx="7" fill="#effaf5" stroke="#16845b" stroke-width="1.5"/><text x="760" y="315" font-size="17" font-weight="700" fill="#16845b" text-anchor="middle">OpenSpec Control Plane</text><text x="760" y="337" font-size="14" text-anchor="middle">Proposal → Design → Specs → Tasks</text>
  <text class="sub" x="760" y="369">Why / What / How / Acceptance · 变更状态与归档知识</text>
  <text class="ct" x="1205" y="316">Skills</text><text class="sub" x="1205" y="339">按需加载工作流</text><text class="sub" x="1205" y="359">专业知识与工具</text>
  <text class="ct" x="1435" y="316">Project Context</text><text class="sub" x="1435" y="339">代码 · 文档 · 依赖</text><text class="sub" x="1435" y="359">Git 历史 · 本地状态</text>
  <path class="bf" d="M1340 185V213H885V220"/><path class="gf" d="M885 417V437"/>

  <rect x="30" y="445" width="150" height="235" rx="9" fill="#e85d04"/><text class="num" x="105" y="488">03</text><text class="side" x="105" y="523">AI Coding</text><text class="side" x="105" y="551">Engine</text><text x="105" y="580" fill="#fff0e6" font-size="12" text-anchor="middle">读取 · 修改 · 验证</text>
  <rect class="panel" x="200" y="445" width="1370" height="235" stroke="#e85d04"/>
  <rect x="545" y="463" width="680" height="58" rx="9" fill="#fff5ed" stroke="#e85d04" stroke-width="2"/><text x="885" y="488" font-size="21" font-weight="750" fill="#d95200" text-anchor="middle">AI Coding Agent</text><text class="sub" x="885" y="509">以 OpenSpec tasks 为执行队列，以仓库 Harness 为行为边界</text>
  <g stroke="#e85d04"><rect class="card" x="235" y="550" width="175" height="65"/><rect class="card" x="430" y="550" width="175" height="65"/><rect class="card" x="625" y="550" width="175" height="65"/><rect class="card" x="820" y="550" width="175" height="65"/><rect class="card" x="1015" y="550" width="175" height="65"/><rect class="card" x="1210" y="550" width="175" height="65"/><rect class="card" x="1405" y="550" width="135" height="65"/></g>
  <text class="ct" x="322" y="578">Read</text><text class="sub" x="322" y="598">规格与仓库状态</text><text class="ct" x="517" y="578">Reason</text><text class="sub" x="517" y="598">方案与风险</text><text class="ct" x="712" y="578">Code</text><text class="sub" x="712" y="598">实现与重构</text><text class="ct" x="907" y="578">Test</text><text class="sub" x="907" y="598">自动化检查</text><text class="ct" x="1102" y="578">Experience</text><text class="sub" x="1102" y="598">端上真实验证</text><text class="ct" x="1297" y="578">Archive</text><text class="sub" x="1297" y="598">规格与文档</text><text class="ct" x="1472" y="578">Ship</text><text class="sub" x="1472" y="598">Commit / Push</text>
  <path class="of" d="M410 582H420M605 582H615M800 582H810M995 582H1005M1190 582H1200M1385 582H1395"/><path class="of" d="M1472 615V651H322V625"/><text class="sub" x="885" y="668">发现差异即回到读取与推理，直到实现、规格和运行证据一致</text>

  <rect x="30" y="708" width="150" height="135" rx="9" fill="#128995"/><text class="num" x="105" y="748">04</text><text class="side" x="105" y="782">完整项目</text><text x="105" y="810" fill="#d9f8fa" font-size="12" text-anchor="middle">Repository Output</text>
  <rect class="panel" x="200" y="708" width="1370" height="135" stroke="#128995"/><text class="h" x="885" y="739" fill="#128995">AI Coding Agent 持续完成整个 Agent Py</text>
  <g stroke="#128995"><rect class="card" x="225" y="762" width="150" height="55"/><rect class="card" x="392" y="762" width="150" height="55"/><rect class="card" x="559" y="762" width="150" height="55"/><rect class="card" x="726" y="762" width="150" height="55"/><rect class="card" x="893" y="762" width="150" height="55"/><rect class="card" x="1060" y="762" width="150" height="55"/><rect class="card" x="1227" y="762" width="150" height="55"/><rect class="card" x="1394" y="762" width="150" height="55"/></g>
  <text class="ct" x="300" y="786">Vue Frontend</text><text class="sub" x="300" y="804">中国用户体验</text><text class="ct" x="467" y="786">FastAPI</text><text class="sub" x="467" y="804">API / SSE</text><text class="ct" x="634" y="786">Chat Agent</text><text class="sub" x="634" y="804">LangChain</text><text class="ct" x="801" y="786">AIOps</text><text class="sub" x="801" y="804">LangGraph</text><text class="ct" x="968" y="786">RAG</text><text class="sub" x="968" y="804">Hybrid Search</text><text class="ct" x="1135" y="786">MCP</text><text class="sub" x="1135" y="804">真实工具</text><text class="ct" x="1302" y="786">Storage</text><text class="sub" x="1302" y="804">SQLite / Milvus</text><text class="ct" x="1469" y="786">Infra</text><text class="sub" x="1469" y="804">Scripts / Compose</text>
  <path class="of" d="M885 680V700"/>

  <rect x="30" y="870" width="150" height="100" rx="9" fill="#6044a6"/><text class="num" x="105" y="902">05</text><text class="side" x="105" y="936">反馈闭环</text>
  <rect class="panel" x="200" y="870" width="1370" height="100" stroke="#6044a6"/>
  <g stroke="#6044a6"><rect class="card" x="225" y="895" width="240" height="48"/><rect class="card" x="485" y="895" width="240" height="48"/><rect class="card" x="745" y="895" width="240" height="48"/><rect class="card" x="1005" y="895" width="240" height="48"/><rect class="card" x="1265" y="895" width="280" height="48"/></g>
  <text class="ct" x="345" y="925">Tests / Types / Lint</text><text class="ct" x="605" y="925">OpenSpec Validate</text><text class="ct" x="865" y="925">Browser Evidence</text><text class="ct" x="1125" y="925">VitePress Docs</text><text class="ct" x="1405" y="925">Git History / Runtime Evidence</text>
  <path class="fb" d="M1545 919H1582V322H1555"/><path class="fb" d="M1125 870V856H1575"/>
</svg>
